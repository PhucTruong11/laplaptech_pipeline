laplaptech_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'default_password') }}"
      dbname: "{{ env_var('POSTGRES_DATABASE', 'laplaptech_pipeline') }}"
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'prefer') }}"
      schema: public
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"

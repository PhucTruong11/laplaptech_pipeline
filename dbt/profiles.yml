laplaptech_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '123456') }}"
      dbname: "{{ env_var('POSTGRES_DATABASE', 'laplaptech_pipeline') }}"
      schema: public
      threads: 4

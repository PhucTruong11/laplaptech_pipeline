name: 'laplaptech_pipeline'
version: '1.0.0'

profile: 'laplaptech_pipeline'

vars:
  business_timezone: 'Asia/Ho_Chi_Minh'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  laplaptech_pipeline:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

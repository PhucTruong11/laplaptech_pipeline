version: 2

models:
  # ── Silver tests ──────────────────────────────────────────────
  - name: silver_brand
    columns:
      - name: brand_id
        tests:
          - unique
          - not_null

  - name: silver_cpu_model
    columns:
      - name: cpu_id
        tests:
          - unique
          - not_null

  - name: silver_gpu_model
    columns:
      - name: gpu_id
        tests:
          - unique
          - not_null

  - name: silver_laptop_model
    columns:
      - name: laptop_model_id
        tests:
          - unique
          - not_null
       # relationships
      - name: brand_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_brand')
                field: brand_id
      - name: cpu_id
        tests:
          - relationships:
              arguments:
                to: ref('silver_cpu_model')
                field: cpu_id
      - name: gpu_id
        tests:
          - relationships:
              arguments:
                to: ref('silver_gpu_model')
                field: gpu_id
      # accepted values cho cờ trạng thái
      - name: is_visible
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_active
        tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: silver_laptop_benchmark_result
    columns:
      - name: benchmark_id
        tests:
          - unique
          - not_null
      - name: laptop_model_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_laptop_model')
                field: laptop_model_id    

  - name: silver_user_event_tracking
    columns:
      - name: session_id
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null

  # ── Gold tests ────────────────────────────────────────────────
  - name: mart_brand_interest
    columns:
      - name: brand_id
        tests:
          - unique
          - not_null

  - name: mart_performance_ranking
    columns:
      - name: laptop_model_id
        tests:
          - unique
          - not_null

  - name: mart_daily_site_kpis
    columns:
      - name: event_date
        tests:
          - unique
          - not_null
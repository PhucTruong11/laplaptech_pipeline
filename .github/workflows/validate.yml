name: Validate pipeline code

on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: laplaptech_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laplaptech_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q ingestion streamlit_app
      - name: Test ingestion and daily KPI on isolated PostgreSQL
        run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:local_test_only@localhost:5432/laplaptech_pipeline_test
      - run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: parse_only
          POSTGRES_PASSWORD: parse_only
          POSTGRES_DATABASE: parse_only
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

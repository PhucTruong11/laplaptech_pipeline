name: Validate pipeline code

on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: laplaptech_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laplaptech_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q ingestion streamlit_app
      - name: Test ingestion and daily KPI on isolated PostgreSQL
        run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:local_test_only@localhost:5432/laplaptech_pipeline_test
      - run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: parse_only
          POSTGRES_PASSWORD: parse_only
          POSTGRES_DATABASE: parse_only
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      - name: Build and reconcile raw to Gold, then replay
        run: python -m scripts.run_dev_pipeline --source fixture
        env:
          DEV_DATABASE_URL: postgresql+psycopg2://postgres:local_test_only@localhost:5432/laplaptech_pipeline_test
      - name: Test all dashboard tabs against built Gold
        run: python -m unittest discover -s tests -p test_dashboard.py -v
        env:
          DASHBOARD_TEST_DATABASE_URL: postgresql+psycopg2://postgres:local_test_only@localhost:5432/laplaptech_pipeline_test
      - name: Save dev validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-validation-${{ github.run_id }}
          path: |
            scratch/dev-e2e-*/report.json
            scratch/dev-e2e-*/target/manifest.json
            scratch/dev-e2e-*/target/run_results.json
            scratch/dev-e2e-*/target/sources.json

name: "LaplapTech Pipeline — Sync & Transform"

on:
  push:
    branches: [main, develop]
  schedule:
    # TEST: chay moi 5 phut de kiem tra schedule trigger
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
  CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
  CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
  CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
  CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}

jobs:
  sync-and-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion (ClickHouse → PostgreSQL)
        run: python ingestion/clickhouse_to_postgres.py

      - name: Run dbt build
        working-directory: dbt
        run: |
          dbt deps
          dbt build --profiles-dir .

      - name: Run dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .

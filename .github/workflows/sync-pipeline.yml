name: "LaplapTech Pipeline — Sync & Transform"

on:
  push:
    branches: [main]
  schedule:
    # 01:15 UTC = 08:15 Vietnam time (Tránh nghẽn mạng đầu giờ)
    - cron: "15 1 * * *"
    # 09:45 UTC = 16:45 Vietnam time
    - cron: "45 9 * * *"
  workflow_dispatch:

concurrency:
  group: laplaptech-production-warehouse
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
  CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
  CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
  CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
  CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
  POSTGRES_SSLMODE: require
  POSTGRES_CREATE_DATABASE: "false"
  INGESTION_LOOKBACK_SECONDS: "7200"

jobs:
  sync-and-transform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion (ClickHouse → PostgreSQL)
        run: python ingestion/clickhouse_to_postgres.py

      - name: Check source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir .

      - name: Build models and run tests
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Save dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/sources.json
          if-no-files-found: warn
          retention-days: 14

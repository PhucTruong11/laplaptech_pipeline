x-platform-image: &platform-image
  image: airflow-platform:3.3.2-docker4.6.1-py3.13
  build:
    context: .
    dockerfile: Dockerfile

x-project-guardrails: &project-guardrails
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  airflow-init:
    <<: *platform-image
  airflow-api-server:
    <<: *platform-image
    volumes:
      - ${LAPLAPTECH_PROJECT_DIR:?Set LAPLAPTECH_PROJECT_DIR in platform .env}/infra/laplaptech/dags:/opt/airflow/dags/laplaptech:ro
  airflow-dag-processor:
    <<: *platform-image
    volumes:
      - ${LAPLAPTECH_PROJECT_DIR:?Set LAPLAPTECH_PROJECT_DIR in platform .env}/infra/laplaptech/dags:/opt/airflow/dags/laplaptech:ro
  airflow-scheduler:
    <<: *platform-image
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LAPLAPTECH_PROJECT_DIR:?Set LAPLAPTECH_PROJECT_DIR in platform .env}/infra/laplaptech/dags:/opt/airflow/dags/laplaptech:ro

  warehouse-laplaptech:
    <<: *project-guardrails
    image: postgres:16
    mem_limit: ${RESOURCE_LAPLAPTECH_WAREHOUSE_MEMORY_MIB:-1024}m
    memswap_limit: ${RESOURCE_LAPLAPTECH_WAREHOUSE_MEMORY_MIB:-1024}m
    cpus: ${RESOURCE_LAPLAPTECH_WAREHOUSE_CPUS:-1.5}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=40", "-c", "max_parallel_workers_per_gather=0"]
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: laplaptech
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Initialize platform secrets first}
      POSTGRES_DB: laplaptech_pipeline_dev
    volumes:
      - laplaptech-warehouse:/var/lib/postgresql/data
    networks:
      - laplaptech-lab
    ports:
      - "127.0.0.1:${WAREHOUSE_HOST_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laplaptech -d laplaptech_pipeline_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard:
    <<: *project-guardrails
    profiles: [dashboard]
    image: laplaptech-dashboard:local-v1
    mem_limit: ${RESOURCE_LAPLAPTECH_DASHBOARD_MEMORY_MIB:-512}m
    memswap_limit: ${RESOURCE_LAPLAPTECH_DASHBOARD_MEMORY_MIB:-512}m
    cpus: ${RESOURCE_LAPLAPTECH_DASHBOARD_CPUS:-0.5}
    build:
      context: ${LAPLAPTECH_PROJECT_DIR:?Set LAPLAPTECH_PROJECT_DIR in platform .env}
      dockerfile: infra/laplaptech/dashboard.Dockerfile
    environment:
      POSTGRES_HOST: warehouse-laplaptech
      POSTGRES_PORT: "5432"
      POSTGRES_USER: laplaptech_dashboard
      POSTGRES_PASSWORD: ${LAPLAPTECH_DASHBOARD_PASSWORD:?Provision LapLapTech access first}
      POSTGRES_DATABASE: laplaptech_pipeline_dev
      POSTGRES_SSLMODE: prefer
      GOLD_SCHEMA: public_gold
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    networks:
      - laplaptech-lab
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      warehouse-laplaptech:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "streamlit_app.health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  laplaptech-lab:
    name: laplaptech-lab
    driver: bridge

volumes:
  laplaptech-warehouse:
    name: laplaptech-lab-warehouse
